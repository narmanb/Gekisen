name: Build Dragonball Ruination APK (Godot)

on:
  push:
    paths:
      - 'ruination/godot/**'
      - 'ruination/tools/*.sh'
      - 'ruination/tools/*.py'
      - '.github/workflows/ruination.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.3-stable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-android

      - name: Download Godot and the Android export template
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot ~/.local/share/godot/export_templates/4.3.stable
          cd ~/godot
          curl -sSfLO https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}_linux.x86_64.zip
          curl -sSfLO https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz
          unzip -q -j Godot_v${GODOT_VERSION}_export_templates.tpz templates/android_release.apk templates/android_debug.apk templates/version.txt \
            -d ~/.local/share/godot/export_templates/4.3.stable
          rm Godot_v${GODOT_VERSION}_export_templates.tpz

      - name: Build APK
        run: GODOT=~/godot/Godot_v${GODOT_VERSION}_linux.x86_64 sh ruination/tools/build_apk.sh

      - uses: actions/upload-artifact@v4
        with:
          name: DragonballRuination-apk
          path: ruination/godot/build/DragonballRuination.apk

      - name: Publish as a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ruination-${GITHUB_REF_NAME//\//-}"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" ruination/godot/build/DragonballRuination.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "Dragonball Ruination for Android ($GITHUB_REF_NAME, build $GITHUB_RUN_NUMBER)" \
            --notes "Single-player Godot build of Dragonball Ruination. Download DragonballRuination.apk on your phone and open it to install (Android 7.0+)."
